version: "3.8"

services:
  db-loja:
    image: postgres:16-alpine
    container_name: db-loja
    restart: unless-stopped
    environment:
      POSTGRES_DB: loja_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5437:5432"
    volumes:
      - db_loja_data:/var/lib/postgresql/data

volumes:
  db_loja_data:
